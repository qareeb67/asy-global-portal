services:
  - type: web
    name: asy-global-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        fromService:
          name: asy-global-portal
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        fromDatabase:
          name: asy-global-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: STORAGE_DIR
        value: ./storage

  - type: web
    name: asy-global-portal
    runtime: static
    rootDir: client
    buildCommand: npm install && node -e "const fs=require('fs'); const u=process.env.VITE_API_URL; if(!u) throw new Error('VITE_API_URL missing'); fs.writeFileSync('src/generated-api-url.js', `export default ${JSON.stringify(u.replace(/\/$/, '') + '/api')};\n`)" && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: asy-global-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: asy-global-db
    databaseName: asy_global
    user: asy_global_user
    plan: free
    region: frankfurt
